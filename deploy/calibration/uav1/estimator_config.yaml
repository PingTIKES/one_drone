%YAML:1.0 # need to specify the file type at the top!

# ============================================================================
# OpenVINS 真机估计器配置（D435i，序列号 135122071701，640×480 Y8 双红外）
# 基于官方 euroc_mav/estimator_config.yaml 模板（master, ROS2）
# 运行（由 launch 自动带参）：
#   ros2 run ov_msckf run_subscribe_msckf --ros-args -p config_path:=<本文件>
# ============================================================================

verbosity: "WARNING" # 日志级别：ALL/DEBUG/INFO/WARNING/ERROR/SILENT

use_fej: true # 首次估计雅可比；用于提高估计一致性
integration: "rk4" # IMU 积分方式：discrete/rk4/analytical
use_stereo: true # 是否启用双目约束
max_cameras: 2 # 相机数量

# 使用本次离线标定结果，包括已测得的相机–IMU 时间偏移；关闭在线标定。
calib_cam_extrinsics: false # 在线估计相机与 IMU 外参
calib_cam_intrinsics: false # 在线估计相机内参
calib_cam_timeoffset: false # 在线估计相机与 IMU 时间偏移
calib_imu_intrinsics: false # 在线估计 IMU 内参
calib_imu_g_sensitivity: false # 在线估计陀螺仪重力敏感性

max_clones: 11 # 滑动窗口位姿克隆数；增大会提高计算量
max_slam: 25 # 状态向量中 SLAM 特征最大数量
max_slam_in_update: 10 # 每批更新的 SLAM 特征数
max_msckf_in_update: 30 # 每次更新的 MSCKF 特征最大数
dt_slam_delay: 1 # SLAM 特征初始化延迟（s）

gravity_mag: 9.81 # 重力加速度模长（m/s²）

feat_rep_msckf: "GLOBAL_3D" # MSCKF 特征坐标表示方式
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH" # SLAM 特征坐标表示方式
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH" # ArUco 特征坐标表示方式

# zero velocity update parameters we can use
# we support either IMU-based or disparity detection.
# 必须开启：上游逻辑 wait_for_jerk = (updaterZUPT == nullptr)，
# 即 try_zupt: false 时静止初始化会"等待加速度 jerk"（静止→动起来
# 的瞬间才初始化），纯静置永远报 "failed static init: no accel jerk
# detected"。打开 ZUPT 后静置即立即初始化。
# zupt_only_at_beginning: true 使 ZUPT 只在初始化前后生效，
# 起飞/悬停后自动禁用，不影响飞行中的估计。
try_zupt: true # 是否启用零速度更新
zupt_chi2_multipler: 0 # 零速卡方门限倍率；0 使用纯视差判断
zupt_max_velocity: 0.1 # 零速判定最大速度（m/s）
zupt_noise_multiplier: 10 # 零速更新噪声倍率
zupt_max_disparity: 1.0 # 零速判定最大图像位移（像素）
zupt_only_at_beginning: true # 零速更新仅用于启动阶段，避免飞行中误锁静止

# ==================================================================
# 初始化：静止初始化（默认）。起飞前让飞机在停机坪静置约 3 秒，
# 终端出现 "Initialized" 后再起飞；若要在运动中初始化改 init_dyn_use: true
init_window_time: 2.0 # 初始化数据窗口（s）
init_imu_thresh: 1.5 # 静态初始化的加速度变化判据阈值
init_max_disparity: 10.0 # 静态初始化允许的最大图像位移（像素）
init_max_features: 50 # 初始化阶段最多跟踪的特征数量

init_dyn_use: false # 启用运动初始化
init_dyn_mle_opt_calib: false # 动态初始化时优化标定参数
init_dyn_mle_max_iter: 50 # 动态初始化最大优化迭代数
init_dyn_mle_max_time: 0.05 # 动态初始化优化时间预算（s）
init_dyn_mle_max_threads: 6 # 动态初始化最大线程数
init_dyn_num_pose: 6 # 动态初始化窗口内位姿数
init_dyn_min_deg: 10.0 # 动态初始化要求的最小旋转（度）

init_dyn_inflation_ori: 10 # 初始化后姿态协方差放大倍率
init_dyn_inflation_vel: 100 # 初始化后速度协方差放大倍率
init_dyn_inflation_bg: 10 # 初始化后陀螺偏置协方差放大倍率
init_dyn_inflation_ba: 100 # 初始化后加计偏置协方差放大倍率
init_dyn_min_rec_cond: 1e-12 # 信息矩阵求逆最小倒条件数

init_dyn_bias_g: [ 0.0, 0.0, 0.0 ] # 陀螺零偏初值（rad/s，XYZ）
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ] # 加速度计零偏初值（m/s²，XYZ）

# ==================================================================
# ==================================================================

record_timing_information: true # 记录各算法步骤耗时
record_timing_filepath: "/tmp/uav1_ov_timing.txt" # 耗时输出文件路径

# if we want to save the simulation state and its diagional covariance
# use this with rosrun ov_eval error_simulation
save_total_state: false # 保存估计状态及协方差
filepath_est: "/tmp/ov_estimate.txt" # 估计状态文件路径
filepath_std: "/tmp/ov_estimate_std.txt" # 标准差文件路径
filepath_gt: "/tmp/ov_groundtruth.txt" # 真值文件路径；导航不读取此文件作为定位

# ==================================================================
# 前端特征跟踪（框架文档约束：特征 <=150，RK3566 上保实时）
use_klt: true # 使用 KLT 光流；false 使用描述子匹配
num_pts: 150 # 每台相机提取跟踪的目标特征数量
fast_threshold: 20 # FAST 角点阈值；降低可增加特征和计算量
grid_x: 5 # 水平方向特征均匀提取网格数
grid_y: 5 # 垂直方向特征均匀提取网格数
min_px_dist: 10 # 特征点最小间距（像素）
knn_ratio: 0.70 # 描述子最近邻匹配比值阈值
# 实际相机输出为 30 Hz；接纳上限设为 40 Hz，避免小幅时间戳抖动导致丢帧。
track_frequency: 40.0 # 图像接纳频率上限（Hz），不改变相机实际帧率
stereo_sync_max_interval: 0.003 # 左右目配对最大时间差（s）；D435i 同步帧应接近 0，丢帧时拒绝跨帧配对
fi_max_baseline: 120.0 # 三角化允许的特征距离/有效基线最大比值（无单位）；5 cm 双目基线需支持几米外特征
fi_max_cond_number: 100000.0 # 三角化线性系统最大条件数；拒绝退化解，与短基线的比值限制配合
downsample_cameras: false # 将相机图像缩小一半
num_opencv_threads: 2 # OpenCV 线程数；-1 自动，0/1 串行
histogram_method: "CLAHE" # 对比度处理：NONE/HISTOGRAM/CLAHE

# aruco tag tracker for the system
use_aruco: false # 启用 ArUco 标记跟踪
num_aruco: 1024 # 支持的 ArUco 标记数量
downsize_aruco: true # ArUco 检测前是否缩小图像

# ==================================================================
# 图像观测噪声与卡方阈值；当前沿用估计器默认值，按实际跟踪表现调整
up_msckf_sigma_px: 1 # MSCKF 像素观测噪声标准差（像素）
up_msckf_chi2_multipler: 1 # MSCKF 卡方检验门限倍率
up_slam_sigma_px: 1 # SLAM 像素观测噪声标准差（像素）
up_slam_chi2_multipler: 1 # SLAM 卡方检验门限倍率
up_aruco_sigma_px: 1 # ArUco 像素观测噪声标准差（像素）
up_aruco_chi2_multipler: 1 # ArUco 卡方检验门限倍率

# masks for our images
use_mask: false # 启用图像掩膜

# imu and camera spacial-temporal（相对本文件所在目录）
relative_config_imu: "kalibr_imu_chain.yaml" # 相对本文件的 IMU 标定文件路径
relative_config_imucam: "kalibr_imucam_chain.yaml" # 相对本文件的相机与 IMU 联合标定文件路径

use_multi_threading_subs: false # 并发处理传感器回调；默认关闭以保证时序
