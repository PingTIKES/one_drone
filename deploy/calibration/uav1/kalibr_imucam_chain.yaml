%YAML:1.0
cam0:
  # 相机投影模型
  camera_model: pinhole
  # 畸变模型；radtan 对应 k1、k2、p1、p2
  distortion_model: radtan
  # 本次 image_rect_raw 图像流拟合的剩余畸变，不能套用于其他图像模式
  distortion_coeffs: [0.01876861707550538, -0.0012952751743095705, 0.001356034000629303, -0.0015364827904599955]
  # fx、fy、cx、cy，单位像素
  intrinsics: [386.58959501590726, 386.08824248094635, 321.27485058934025, 235.64852743991966]
  # 标定分辨率，宽×高；真机输入必须匹配
  resolution: [640, 480]
  # IMU←相机光学坐标系，4×4 变换；由 Kalibr T_cam_imu 求逆得到，平移单位 m
  T_imu_cam: [[0.999998707702603, 0.0003087559486239574, 0.00157773980359759, -0.009980539654113323], [-0.0003132959284277504, 0.9999958092281537, 0.0028780847435445293, 0.0017772067277056513], [-0.0015768445658648272, -0.0028785753236596928, 0.999994613668154, 0.01758335485165594], [0.0, 0.0, 0.0, 1.0]]
  # 相机–IMU 时间偏移（s）；t_imu=t_cam+此值，OpenVINS 使用 cam0 的值
  timeshift_cam_imu: -0.0027017031335248966
  # 可互相观测的另一台相机编号
  cam_overlaps: [1]
  # 算法内部图像话题；启动入口将真实左右红外话题转发到此处
  rostopic: /uav1/cam0/image_raw
cam1:
  # 相机投影模型
