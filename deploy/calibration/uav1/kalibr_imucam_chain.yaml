  distortion_coeffs: [0.015564947546824307, 0.004450197195834853, 0.000751249384852781, -0.0011970534055994165]
  # fx、fy、cx、cy，单位像素
  intrinsics: [387.03885278932376, 386.5538115376606, 320.09643116760697, 235.63289018512742]
  # 标定分辨率，宽×高；真机输入必须匹配
  resolution: [640, 480]
  # IMU←相机光学坐标系，4×4 变换；由 Kalibr T_cam_imu 求逆得到，平移单位 m
  T_imu_cam: [[0.9999959176675873, 0.00037533073083366973, -0.0028326268731347923, 0.04019214193312839], [-0.00036028679028308704, 0.9999858391065514, 0.005309593185456392, 0.0016187066322670733], [0.0028345796140981884, -0.005308550951887839, 0.9999818920586525, 0.017213385241029354], [0.0, 0.0, 0.0, 1.0]]
  # 相机–IMU 时间偏移（s）；t_imu=t_cam+此值，OpenVINS 使用 cam0 的值
  timeshift_cam_imu: -0.0026490515871446484
  # 可互相观测的另一台相机编号
  cam_overlaps: [0]
  # 算法内部图像话题；启动入口将真实左右红外话题转发到此处
