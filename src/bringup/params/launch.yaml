# 总启动配置；修改后重启 launch。日常只需 ros2 launch bringup startup.launch.py。
# 笔记本仿真：startup.sim=true；RK3566 真机：startup.sim=false、rviz=false。
# 两端使用相同源码。sim 自动选下面整套 profile；迁移时只修改本文件，无需改 launch/Python/C++。
# 真机无前视相机保留 hardware.perception_enabled=false；以后接入相机时改为 true。
startup:
  sim: true # false 使用下面 hardware 真机配置；true 使用 simulation 仿真配置
  rviz: true # 是否打开 RViz
  yaw_control: false # true 使用平移/yaw 解耦策略；false 保持起飞/手动接入 OFFBOARD 时的机头方向，自动补偿飞控航向重置
  flight_control: true # true 启动飞控控制与起降服务；无桨定位检查设为 false
  map_file: '' # 留空读取 global_config.yaml 的 map；也可填地图 YAML 文件名或绝对路径
  depth_scale: 0.001 # 16UC1 深度单位转换到 m 的比例；32FC1 深度已是 m

hardware:
  bootstrap_takeoff: true # 下视 MicoVIO：无水平 odom 时姿态/高度反馈起飞，空中初始化后接管导航
  bootstrap_height_source: range # MicoVIO 下视 ToF 离地高度，避免 VIO 初始化时 EKF 高度原点变化；须能收到有效测距
  bootstrap_hover_thrust: 0.5 # 真机归一化悬停推力：上桨前按本机实测/PX4 参数核对，当前为待核实初值
  bootstrap_max_thrust: 0.7 # 真机姿态起飞推力上限，须高于本机悬停推力
  localization_source: microvio # microvio 订阅 MAVROS 转发的定位；openvins 使用双目和 IMU
  perception_enabled: false # false 关闭相机处理，EGO/打点/决策照常；true 但没有深度帧时仍可按未知区域规划
  depth_source: hardware # hardware 使用 D435i 深度；software 使用项目软件双目
  calibration_dir: ~/one_drone/deploy/calibration/uav1 # 已导入的真机标定目录，支持 ~
  target_system: 1 # 实际飞控 MAV_SYS_ID，接入前核对
  mavros_ns: /mavros # MAVROS 状态、设定值与服务的 ROS 名称空间
  fcu_url: /dev/serial/by-id/usb-MicoAir_MicoAir743v2_0-if00:921600 # MAVROS 独占的飞控串口及波特率
  gcs_url: '' # 可选转发给地面站的 MAVLink UDP 地址；留空关闭
  cam0_topic: /camera/camera/infra1/image_rect_raw # 左红外，必须对应标定 cam0
  cam1_topic: /camera/camera/infra2/image_rect_raw # 右红外，必须对应标定 cam1
  imu_topic: /camera/camera/imu # 仅 OpenVINS 定位需要；microvio+软件双目深度不使用该 IMU
  depth_topic: /camera/camera/depth/image_rect_raw # 未对齐到 RGB 的硬件深度
  depth_info_topic: /camera/camera/depth/camera_info # 与深度匹配的 CameraInfo

simulation:
  bootstrap_takeoff: false # OpenVINS 通常在地面已初始化；true 可在仿真验证姿态起飞与导航接管
  bootstrap_height_source: local # 仿真使用 PX4 本地垂直高度反馈
  bootstrap_hover_thrust: 0.75 # 当前 X500+相机在 Gazebo 电机速度模型中的悬停推力约值，仅用于仿真姿态起飞
  bootstrap_max_thrust: 0.85 # 仿真起飞推力上限；不能照搬到真机
  localization_source: openvins # 仿真使用 OpenVINS，不读取实机 microvio 串口
  perception_enabled: true # 仿真图像生成深度；EGO 规划独立启动
  depth_source: software # 仿真使用图像计算深度
  calibration_dir: '' # 仿真自动使用 vio_bridge/config/openvins_sim
  target_system: 2 # 当前仿真飞控 MAV_SYS_ID
  mavros_ns: /mavros # 仿真也采用 MAVROS，不启动 DDS Agent
  fcu_url: udp://:14541@127.0.0.1:14581 # PX4 SITL instance=1 的 MAVLink Onboard 端口
  gcs_url: '' # 仿真地面站转发，留空关闭
  cam0_topic: '' # 仿真传感器由 Gazebo 桥直接发布，无需真机输入话题
  cam1_topic: '' # 同上
  imu_topic: '' # 同上
  depth_topic: '' # 软件双目节点自动提供深度
  depth_info_topic: '' # 软件双目节点自动提供 CameraInfo

ego_planner:
  respawn: true # 规划器异常退出后自动重新创建进程；不检测存活但卡死的情况
  respawn_delay: 0.1 # 检测进程退出后等待秒数；不包含进程初始化和地图重建耗时
