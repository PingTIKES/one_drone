flight_bridge:
  ros__parameters:
    px4_ns: px4_1
    target_system: 2
    takeoff_altitude: 2.0
    max_horizontal_speed: 1.5
    max_yaw_rate: 0.8
    allow_reverse: false
    max_lateral_speed: 0.0
    reaction_time: 0.5
    assumed_braking_deceleration: 0.6
    safety_margin: 0.5
    verified_forward_range: 5.0
    command_timeout: 0.3
    pose_timeout: 0.5
    vio_timeout: 0.5
    vio_stable_time: 1.0
    depth_heartbeat_timeout: 0.3
    depth_grace: 0.55
    takeoff_tolerance: 0.2
    takeoff_stable_time: 1.0
