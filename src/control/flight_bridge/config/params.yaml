# 修改后重启对应节点生效。null 表示由启动入口/标定生成；不要用猜测值替代外参。
flight_bridge:
  ros__parameters:
    px4_ns: px4_1 # PX4 DDS 命名空间；启动时由 px4_ns 参数确定
    target_system: 2 # 飞控 MAVLink 系统编号；启动参数优先，真机必须显式指定
    takeoff_altitude: 2.0 # 相对起飞高度（m）
    max_horizontal_speed: 0.5 # 最大水平速度（m/s）；须与 EGO 三处速度上限一起调整
    max_vertical_speed: 0.3 # 最大升降速度（m/s）
    max_yaw_rate: 0.35 # 正常偏航角速度上限（rad/s）
    position_gain: 0.8 # 位置误差转速度的比例增益（1/s）
    yaw_soft_limit_deg: 30.0 # 目标方向偏差小于此角度时保持航向（度）
    yaw_hard_limit_deg: 100.0 # 进入最小平移速度比例的方向偏差（度）
    yaw_reverse_limit_deg: 150.0 # 超过此方向偏差停止平移（度）
    yaw_min_speed_scale: 0.25 # 大角度转向时的最小平移速度比例（0～1）
    yaw_rate_gain: 0.8 # 方向误差转角速度的比例增益（1/s）
    camera_hfov_deg: 87.0 # 前视双目水平视角（度）；仿真 D435i 约 87 度，真机按标定值改
    yaw_lookahead_time: 0.3 # 用轨迹速度+加速度预测前方航向的时间（s）
    yaw_outside_fov_speed_scale: 0.25 # 预测运动方向超出前视视角时的水平速度上限比例
    arrival_position_deadband: 0.15 # 到点水平位置死区（m），同时满足速度条件才生效
    arrival_velocity_deadband: 0.10 # 到点轨迹水平速度阈值（m/s）
    arrival_exit_scale: 1.5 # 到点死区退出阈值倍率；大于 1 可防止边界抖动
    degraded_speed_scale: 0.4 # VIO 降级时水平速度上限比例（0～1）
    degraded_max_yaw_rate: 0.10 # VIO 降级时偏航角速度上限（rad/s）
    reaction_time: 0.8 # 制动距离估算中的反应延迟（s），不是深度超时
    assumed_braking_deceleration: 0.6 # 制动距离估算采用的减速度（m/s²）
    safety_margin: 0.5 # 制动距离之外的额外安全距离（m）
    verified_forward_range: 5.0 # 经过验证的前向可感知距离（m）
    command_timeout: 0.2 # 轨迹指令接收超时（s）；轨迹服务器继续发布旧轨迹时不会触发
    pose_timeout: 0.5 # 位置或里程计接收超时（s）
    vio_timeout: 0.5 # VIO 健康消息接收超时（s）
    vio_stable_time: 3.0 # 起飞及 INVALID 恢复所需连续 VALID 时间（s）
    auto_recover_from_hold: true # 满足 VIO 与 PX4 状态条件后是否自动退出 HOLD
    status_timeout: 1.5 # PX4 状态消息接收超时（s）
    depth_heartbeat_timeout: 1.2 # 深度健康消息接收超时（s），不是深度图时间戳超时
    depth_grace: 1.5 # 距最近一次深度健康为 true 的容忍时间（s）
    takeoff_tolerance: 0.2 # 起飞位置允许误差（m）
    takeoff_stable_time: 1.0 # 进入巡航前需持续满足起飞误差的时间（s）
    planner_heartbeat_timeout: 0.75 # 规划器心跳最大真实时间间隔（s），失联进入 HOLD
    map_timeout: 0.75 # 最近成功融合的深度源时间戳最大年龄（s）
    trajectory_max_sample_age: 0.5 # 接收 EGO 轨迹样本时允许的最大 ROS 时间戳年龄（s）
    trajectory_max_future_stamp: 0.1 # 轨迹样本相对本机 ROS 时间最多可超前的秒数
    trajectory_max_planned_speed: 8.0 # 拒绝明显异常的 EGO 水平速度（m/s），独立于飞控速度限幅
    trajectory_max_planned_acceleration: 12.0 # 拒绝明显异常的 EGO 水平加速度（m/s²）
    trajectory_max_tracking_error: 5.0 # 样本位置与当前 odom 相差超过此值时拒绝（m）
