flight_bridge:
  ros__parameters:
    px4_ns: px4_1
    target_system: 2
    takeoff_altitude: 2.0
    max_horizontal_speed: 0.5
    max_vertical_speed: 0.3
    # Yaw is a perception policy, independent from EGO's XYZ trajectory.
    # Up to the soft limit the vehicle translates laterally with fixed yaw.
    # It then translates and turns together; only almost-reverse motion stops.
    max_yaw_rate: 0.35
    position_gain: 0.8
    yaw_soft_limit_deg: 30.0
    yaw_hard_limit_deg: 100.0
    yaw_reverse_limit_deg: 150.0
    yaw_min_speed_scale: 0.25
    yaw_rate_gain: 0.8
    # Endpoint hover deadband. Enter only when both the horizontal tracking
    # error and EGO feed-forward speed are small. The larger exit threshold
    # prevents VIO noise at the boundary from repeatedly enabling yaw control.
    arrival_position_deadband: 0.15
    arrival_velocity_deadband: 0.10
    arrival_exit_scale: 1.5
    # Soft VIO degradation keeps the mission alive at conservative dynamics.
    # INVALID still enters HOLD through the flight-state machine.
    degraded_speed_scale: 0.4
    degraded_max_yaw_rate: 0.10
    reaction_time: 0.8
    assumed_braking_deceleration: 0.6
    safety_margin: 0.5
    verified_forward_range: 5.0
    command_timeout: 0.2
    pose_timeout: 0.5
    vio_timeout: 0.5
    # Require a settled estimator before arming or recovering from INVALID.
    vio_stable_time: 3.0
    # After an INVALID event, resume only when VIO has remained VALID for
    # vio_stable_time and PX4 is armed, in OFFBOARD, position-valid and not in
    # failsafe. The retained navigation goal is replanned from the new pose.
    auto_recover_from_hold: true
    status_timeout: 1.5
    depth_heartbeat_timeout: 1.2
    depth_grace: 1.5
    takeoff_tolerance: 0.2
    takeoff_stable_time: 1.0
