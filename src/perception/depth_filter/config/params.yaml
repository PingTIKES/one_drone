# 修改后重启对应节点生效。null 表示由启动入口/标定生成；不要用猜测值替代外参。
depth_filter:
  ros__parameters:
    depth_scale: null # 16 位深度数值到米的倍率；由 depth_scale 启动参数指定，32FC1 已为米
    min_range: 0.3 # 最小有效深度距离（m）
    max_range: 8.0 # 最大有效深度距离（m）
    spatial_kernel: 3 # 小空洞邻域窗口（像素，正奇数；1 关闭空间处理）
    temporal_alpha: 0.65 # 时间滤波中新帧权重（0～1）；1 不混合历史帧
    temporal_max_delta: 0.4 # 允许混合历史深度的最大差值（m）；避免大跳变拖影
    fill_holes: false # 默认保留无效像素，避免插值产生虚假清障射线；true 才允许小孔插值
    hole_min_neighbors: 5 # 填补空洞所需有效邻域像素数量
    expected_frame_id: null # 自动外参模式的深度光学坐标系；启动入口设置，其他模式不检查
    camera_info_topic: null # 自动外参模式下用于核对坐标系和图像尺寸；启动入口设置
